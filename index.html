
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Patrimônio</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #b5121b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .secundario {
      background: #333;
    }

    #resultado {
      margin-top: 18px;
      padding: 16px;
      border-radius: 8px;
      background: #f1f1f1;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #codigoLido {
      display: block;
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #b5121b;
    }

    #mensagem {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Leitor de Patrimônio</h2>

    <p>
      Posicione a câmera sobre o código de barras
      do equipamento.
    </p>

   <div id="reader">
  <video
    id="video"
    autoplay
    muted
    playsinline
    style="width:100%; max-height:360px; object-fit:contain;">
  </video>
</div>

    <button id="btnIniciar" onclick="iniciarCamera()">
      ABRIR CÂMERA
    </button>

    <button id="btnParar" class="secundario"
      onclick="pararCamera()" disabled>
      PARAR CÂMERA
    </button>

    <div id="resultado" style="display:none">
      Patrimônio identificado:
      <span id="codigoLido"></span>
    </div>

    <div id="mensagem">
      Aguardando início da leitura.
    </div>

    <button id="btnVoltar" class="secundario"
      onclick="voltarSistema()" style="display:none">
      VOLTAR AO INVENTÁRIO
    </button>
  </div>

  <script>
    
let leitor = null;
let lendo = false;
let codigoEncontrado = false;

async function iniciarCamera() {
  const mensagem = document.getElementById('mensagem');
  const video = document.getElementById('video');

  if (!window.ZXing) {
    mensagem.textContent = 'Não foi possível carregar a biblioteca ZXing.';
    return;
  }

  try {
    mensagem.textContent = 'Iniciando câmera...';
    codigoEncontrado = false;

    leitor = new ZXing.BrowserMultiFormatReader();

    const cameras = await leitor.listVideoInputDevices();

    if (!cameras || cameras.length === 0) {
      throw new Error('Nenhuma câmera encontrada.');
    }

    const cameraTraseira = cameras.find(camera =>
      /back|rear|environment|traseira/i.test(camera.label)
    );

    const camera = cameraTraseira || cameras[0];

    leitor.decodeFromVideoDevice(
      camera.deviceId,
      video,
      (resultado, erro) => {
        if (resultado && !codigoEncontrado) {
          codigoEncontrado = true;

          const codigo = resultado.getText();

          document.getElementById('codigoLido').textContent = codigo;
          document.getElementById('resultado').style.display = 'block';
          mensagem.textContent = 'Código identificado com sucesso!';

          document.getElementById('btnVoltar').style.display = 'block';

          enviarCodigo(codigo);
          pararCamera();
        }
      }
    );

    lendo = true;

    document.getElementById('btnIniciar').disabled = true;
    document.getElementById('btnParar').disabled = false;

    mensagem.textContent = 'Câmera ativa. Aponte para o código de barras.';

  } catch (erro) {
    mensagem.textContent = 'Erro ao iniciar câmera: ' + erro.message;
    console.error(erro);
  }
}

async function pararCamera() {
  if (leitor && lendo) {
    try {
      await leitor.reset();
    } catch (erro) {
      console.log(erro);
    }
  }

  lendo = false;

  document.getElementById('btnIniciar').disabled = false;
  document.getElementById('btnParar').disabled = true;
}

function enviarCodigo(codigo) {
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(
      {
        tipo: 'PATRIMONIO_LIDO',
        codigo: codigo
      },
      '*'
    );
  } else {
    document.getElementById('mensagem').textContent =
      'Código lido: ' + codigo +
      '. Abra o leitor pelo sistema de inventário para enviar automaticamente.';
  }
}

function voltarSistema() {
  if (window.opener && !window.opener.closed) {
    window.close();
  } else {
    document.getElementById('mensagem').textContent =
      'Você pode fechar esta aba e retornar ao inventário.';
  }
}

  </script>

</body>
</html>
